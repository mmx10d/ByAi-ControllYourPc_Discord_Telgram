<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>مركز إدارة المحطات الذكية - الجزء الأول 🖥️</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131a26;
      --neon-green: #00ffaa;
      --text-main: #f0f4f8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--neon-green);
      text-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
      margin-bottom: 30px;
    }

    .station-title {
      background: #1c2636;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      border-right: 5px solid var(--neon-green);
      margin-top: 20px;
    }

    .station-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 15px;
      margin-bottom: 40px;
    }

    .station-part {
      background: var(--card-bg);
      border: 1px solid #223147;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
      background: #192233;
      padding: 10px;
      border-radius: 8px;
    }

    .screen-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2c3e5c;
    }

    #screenView {
      width: 100%;
      height: auto;
      display: block;
      cursor: crosshair;
      background: #000;
    }

    select,
    input {
      background: #1c2636;
      color: #fff;
      border: 1px solid #2c3e5c;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }

    .btn-success {
      background: #00cc7d;
      color: #111;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <h1>مركز إدارة المحطات الخلفية المتطورة 🛰️</h1>

  <!-- بداية محطة العرض والتحكم (المحطة الرئيسية) -->
  <div class="station-title">المحطة الأولى: لوحة العرض والبث المباشر (المحطة الرئيسية)</div>

  <div class="station-grid">
    <!-- الجزء الأول: شاشة العرض الحية ومتحكمات الـ FPS -->
    <div class="station-part">
      <div class="controls-bar">
        <button class="btn btn-success" onclick="fetchScreenshot()">تحديث يدوي 🔄</button>

        <select id="fpsSelect" onchange="handleFPSChange()">
          <option value="stop">إيقاف التحديث التلقائي 🛑</option>
          <option value="30">30 إطار في الثانية (كل 33ms) ⚡</option>
          <option value="60">60 إطار في الثانية (كل 16ms) 🔥</option>
          <option value="custom">معدل تحديث مخصص ⚙️</option>
        </select>

        <input type="number" id="customMs" placeholder="الملي ثانية (ms)" style="display:none; width:120px;"
          oninput="handleCustomMsInput()">
      </div>

      <div class="screen-box">
        <img id="screenView" src="" alt="شاشة الكمبيوتر الخاصة بك ستظهر هنا..." onclick="sendClick(event)">
      </div>
    </div>
    <!-- الجزء الثاني: إعدادات ربط البوتات وبوابات الحماية والمستخدمين المصرح لهم -->
    <div class="station-part">
      <h3 style="margin-top: 0; color: var(--neon-green);">⚙️ الإعدادات والحماية الأمنية</h3>

      <!-- بوابات التحكم والربط -->
      <div style="margin-bottom: 20px;">
        <label style="font-size: 13px; color: #8fa0b5;">اختر منصة الربط الحالية:</label>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
          <button class="btn" style="background: #0088cc;" onclick="toggleBotForm('tg')">Telegram Station</button>
          <button class="btn" style="background: #5865F2;" onclick="toggleBotForm('dc')">Discord Station</button>
        </div>
      </div>

      <!-- إعدادات محطة التليجرام -->
      <div id="tgFormSection">
        <div class="form-group">
          <label>اسم مستخدم أدمن التليجرام (بدون @):</label>
          <input type="text" id="tgAdmin" placeholder="مثال: Homam_Dev">
        </div>
        <div class="form-group">
          <label>توكن بوت التليجرام (Bot Token):</label>
          <input type="password" id="tgToken" placeholder="من BotFather">
        </div>
        <button class="btn" style="background:#0088cc;" onclick="connectTelegram()">تفعيل محطة تليجرام 🚀</button>
      </div>

      <!-- إعدادات محطة الديسكورد -->
      <div id="dcFormSection" style="display:none;">
        <div class="form-group">
          <label>اسم مستخدم أدمن الديسكورد:</label>
          <input type="text" id="dcAdmin" placeholder="مثال: homam_king">
        </div>
        <div class="form-group">
          <label>توكن بوت الديسكورد (Bot Token):</label>
          <input type="password" id="dcToken" placeholder="من Developer Portal">
        </div>
        <div class="form-group">
          <label>رقم القناة ID (اختياري للروم المحمي):</label>
          <input type="text" id="dcChannel" placeholder="اتركه فارغاً ليعمل في أي روم">
        </div>
        <button class="btn" style="background:#5865F2;" onclick="connectDiscord()">تفعيل محطة ديسكورد 🚀</button>
      </div>

      <hr style="border: 0; border-top: 1px solid #2c3e5c; margin: 25px 0;">

      <!-- بوابات التحكم الجماعي (إضافة مستخدمين آخرين) -->
      <h4 style="margin: 0 0 10px 0;">👥 إدارة المستخدمين المصرح لهم بالتحكم</h4>
      <div style="display:flex; gap:5px;">
        <input type="text" id="newAllowedUser" placeholder="اسم مستخدم تليجرام أو ديسكورد" style="flex:1;">
        <button class="btn btn-success" style="width:auto; padding: 0 20px;" onclick="addUser()">إضافة</button>
      </div>
      <div class="user-tags" id="allowedUsersList">
        <!-- سيتم حقن المستخدمين المضافين هنا تلقائياً -->
      </div>
    </div>
  </div> <!-- نهاية مصفوفة المحطة الرئيسية الحالية -->

  <!-- 🧠 الأكواد البرمجية للتشغيل والربط الفوري (JavaScript) -->
  <script>
    let streamInterval = null;

    // 1. وظيفة جلب صورة شاشة مفردة يدوياً
    async function fetchScreenshot() {
      try {
        const res = await fetch('/api/screenshot');
        const data = await res.json();
        if (data.success) {
          document.getElementById('screenView').src = data.image;
        }
      } catch (e) {
        console.error("تعذر الاتصال بالمحطة الخلفية:", e);
      }
    }

    // 2. معالجة حساب الإحداثيات وتمرير النقر المباشر للسيرفر
    async function sendClick(event) {
      const img = event.target;
      const rect = img.getBoundingClientRect();

      // موازنة أبعاد الشاشة الحقيقية مع حجم واجهة المتصفح
      const scaleX = window.screen.width / rect.width;
      const scaleY = window.screen.height / rect.height;

      const clickX = Math.round((event.clientX - rect.left) * scaleX);
      const clickY = Math.round((event.clientY - rect.top) * scaleY);

      // تمرير الإحداثيات لعمل الـ PowerShell click
      await fetch('/api/click', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x: clickX, y: clickY, user: "WebConsole_Admin" })
      });

      // تحديث سريع بعد الضغط ليرى المستخدم استجابة الشاشة
      setTimeout(fetchScreenshot, 200);
    }

    // 3. إدارة معدلات التحديث والإطارات (FPS) وإمكانية الإيقاف
    function handleFPSChange() {
      const type = document.getElementById('fpsSelect').value;
      const customInput = document.getElementById('customMs');

      clearInterval(streamInterval);
      customInput.style.display = "none";

      if (type === "stop") return;

      let ms = 1000;
      if (type === "30") ms = 1000 / 30; // ~33ms لكل إطار
      if (type === "60") ms = 1000 / 60; // ~16ms لكل إطار
      if (type === "custom") {
        customInput.style.display = "inline-block";
        return;
      }
      streamInterval = setInterval(fetchScreenshot, ms);
    }

    // 4. تشغيل البث عند اختيار قيم ملي ثانية مخصصة
    function handleCustomMsInput() {
      const ms = parseInt(document.getElementById('customMs').value);
      if (ms && ms > 10) {
        clearInterval(streamInterval);
        streamInterval = setInterval(fetchScreenshot, ms);
      }
    }

    // 5. التبديل المرئي بين نماذج ربط البوتات
    function toggleBotForm(platform) {
      document.getElementById('tgFormSection').style.display = platform === 'tg' ? 'block' : 'none';
      document.getElementById('dcFormSection').style.display = platform === 'dc' ? 'block' : 'none';
    }

    // 6. تفعيل وربط محطة تليجرام
    async function connectTelegram() {
      const admin = document.getElementById('tgAdmin').value;
      const token = document.getElementById('tgToken').value;
      const res = await fetch('/api/config/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, admin })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    // 7. تفعيل وربط محطة ديسكورد
    async function connectDiscord() {
      const admin = document.getElementById('dcAdmin').value;
      const token = document.getElementById('dcToken').value;
      const channelId = document.getElementById('dcChannel').value;
      const res = await fetch('/api/config/discord', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, admin, channelId })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    // 8. إضافة مستخدمين مصرح لهم بالتحكم الجماعي عبر الواجهة
    async function addUser() {
      const userField = document.getElementById('newAllowedUser');
      const username = userField.value.trim();
      if (!username) return;

      const res = await fetch('/api/users/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (data.success) {
        userField.value = '';
        const container = document.getElementById('allowedUsersList');
        container.innerHTML = '';
        data.users.forEach(u => {
          container.innerHTML += `<div class="user-tag">👤 <span>${u}</span></div>`;
        });
      }
    }

    // تشغيل أولي لجلب الشاشة تلقائياً
    fetchScreenshot();
  </script>
</body>

</html>
